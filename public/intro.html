<title>cleancookiq</title>
<!--
  cleancookiq — brand intro / splash sequence           canvas build
  ==================================================================
  The wordmark and the network mark are true vectors traced from the
  supplied logo (glyph outlines via potrace; node centres, radii,
  colours, connector stroke widths and their off-axis offsets all
  measured off the original artwork). Everything is painted on a
  single <canvas> at device pixel ratio, so it stays sharp on retina
  screens and scales to any size.

  THE SEQUENCE
    1. Each letter flows in from the left along the baseline, one at
       a time, with a motion trail and a small settling lift.
    2. The network then builds point by point, starting at the green
       hub and unfurling outward — every new point lands, flashes a
       ring, and the connector grows out from the point already on
       screen to meet it, so the molecule visibly joins up.
    3. As the last connector closes, the descriptor resolves letter by
       letter under the wordmark, and the lockup takes one soft pulse.
    4. Fade, and the platform takes over.

  THE DESCRIPTOR
  Pre-outlined from Manrope Bold (SIL Open Font License 1.1) — the
  same shapes as the supplied logo files, so the splash and the asset
  are identical and no font has to load. It is deliberately not the
  logotype: those traced letterforms only cover the eleven characters
  in "cleancookiq", and faking the missing ones would show.

  CC_CONFIG.tagline set to '' drops the line. Changing the wording
  still works, but falls back to the interface font since only the
  configured string is outlined — ask for new outlines if you settle
  on different wording.

  SOUND
  Synthesised live with Web Audio — there is no audio file to ship or
  host. A warm pad underneath, a soft wooden tick as each letter
  lands, a marimba note for each point of the network climbing a C
  pentatonic scale as it builds, and a chord when the mark completes.
  Browsers block audio until the visitor has interacted with the page,
  so the intro starts silent, shows the speaker control bottom-left,
  and switches itself on at the first click, tap or keypress. The
  choice is remembered for the session. Set sound:false to ship mute,
  volume to taste.

  HOW TO PUT IT IN THE PLATFORM
  1. Copy the <div class="cc-splash"> block, the <style id="cc-style">
     block and the <script id="cc-script"> block into your app shell.
  2. Tune CC_CONFIG at the top of the script.
  3. Handing off to the app, two ways:
       a. Timed — leave waitForApp:false and the intro clears itself.
       b. Real  — set waitForApp:true, then call ccIntro.finish()
                  when your app has actually booted. The intro holds
                  on the finished mark until you do (and clears
                  anyway after maxWait ms as a safety net).
  4. window.addEventListener('cleancookiq:ready', ...) for the handoff.

  Set <html data-theme="dark"> for the dark ground.
-->
<style id="cc-style">
:root {
  --cc-ink: #1C2934;
  --cc-bg-1: #ffffff;

  --cc-skip: rgba(28,41,52,.42);
  --cc-skip-hover: rgba(28,41,52,.80);
}
[data-theme="dark"] {
  --cc-ink: #f4f8fa;
  --cc-bg-1: #131c24;
  --cc-bg-2: #080c11;
  --cc-skip: rgba(244,248,250,.45);
  --cc-skip-hover: rgba(244,248,250,.85);
}

.cc-splash {
  position: fixed; inset: 0; z-index: 9999;
  display: grid; place-items: center;
  background: radial-gradient(118% 128% at 50% 8%, var(--cc-bg-1) 0%, var(--cc-bg-2) 100%);
  transition: opacity .62s ease, visibility .62s;
}
.cc-splash[data-state="out"] { opacity: 0; visibility: hidden; pointer-events: none; }

.cc-inner {
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(18px, 2.8vw, 34px);
  width: min(80vw, 900px);
}
.cc-mark { display: block; width: 100%; aspect-ratio: 1556 / 500; }

.cc-btn {
  position: absolute; bottom: clamp(16px, 3vw, 30px);
  appearance: none; background: none; border: 0; cursor: pointer;
  font: 500 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: .06em; color: var(--cc-skip);
  padding: 10px 12px; border-radius: 8px;
  display: flex; align-items: center;
  opacity: 0; animation: cc-fade .5s ease 1.2s both;
  transition: color .2s ease;
}
.cc-btn:hover { color: var(--cc-skip-hover); }
.cc-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@keyframes cc-fade { to { opacity: 1; } }

.cc-skip  { right: clamp(16px, 3vw, 34px); }
.cc-sound { left: clamp(16px, 3vw, 34px); }
.cc-sound svg { width: 19px; height: 19px; display: block;
                fill: none; stroke: currentColor; stroke-width: 1.6;
                stroke-linecap: round; stroke-linejoin: round; }
.cc-sound .cc-on  { opacity: 0; transition: opacity .18s ease; }
.cc-sound .cc-off { opacity: 1; transition: opacity .18s ease; }
.cc-sound[aria-pressed="true"] .cc-on  { opacity: 1; }
.cc-sound[aria-pressed="true"] .cc-off { opacity: 0; }

@media (max-width: 560px) { .cc-inner { width: 88vw; gap: 22px; } }
</style>

      mod.type = 'sine'; mod.frequency.value = f * 3.01;
      mg.gain.setValueAtTime(f * 1.7, t);
      mg.gain.exponentialRampToValueAtTime(0.6, t + 0.2);
      mod.connect(mg); mg.connect(car.frequency);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(g, t + 0.008);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      car.connect(gn); out(gn);
      car.start(t); mod.start(t);
      car.stop(t + dur + 0.06); mod.stop(t + dur + 0.06);
    }

    function pad(t, dur) {                   // warm bed under the whole thing
      var gn = ac.createGain(), lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.6;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(0.05, t + 1.4);
      gn.gain.setValueAtTime(0.05, t + dur - 0.9);
      gn.gain.linearRampToValueAtTime(0.0001, t + dur);
      [65.41, 98.0, 130.81].forEach(function (f, i) {
        var o = ac.createOscillator();
        o.type = i === 2 ? 'sine' : 'triangle';
        o.frequency.value = f;
        o.detune.value = (i - 1) * 6;
        o.connect(lp);
        o.start(t); o.stop(t + dur + 0.1);
      });
      lp.connect(gn); out(gn);
    }

    function breath(t, dur, f0, f1, g) {     // airy sweep
      var src = ac.createBufferSource(), bp = ac.createBiquadFilter(), gn = ac.createGain();
      src.buffer = noise;
      bp.type = 'bandpass'; bp.Q.value = 1.1;
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(g, t + dur * 0.55);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(gn); out(gn);
      src.start(t); src.stop(t + dur + 0.05);
    }

    function chord(t) {                      // the mark completes
      bell(t, note(5), 0.055, 1.7);
      bell(t + 0.055, note(8), 0.05, 1.6);
      bell(t + 0.11, note(10), 0.045, 1.5);
      var o = ac.createOscillator(), gn = ac.createGain();
      o.type = 'sine'; o.frequency.value = 65.41;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(0.1, t + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(gn); out(gn);
      o.start(t); o.stop(t + 1.2);
    }

    /* the score, in timeline milliseconds */
    function score() {
      var ev = [];
      ev.push({ t: 0, play: function (at, left) { pad(at, Math.max(1.2, left)); } });
      D.glyphs.forEach(function (g, i) {
        var f = 148 * Math.pow(2, i / 46);
        ev.push({ t: g.t + T.gDur * 0.3,
                  play: function (at) { tick(at, f, 0.05); } });
      });
      var seq = D.nodes.map(function (n, i) { return { i: i, t: n.t }; })
                       .sort(function (a, b) { return a.t - b.t; });
      seq.forEach(function (s, k) {
        var f = note(k), g = 0.075 - k * 0.0022, dur = 1.25 - k * 0.045;
        ev.push({ t: s.t + T.nDur * 0.84,
                  play: function (at) { bell(at, f, g, dur); } });
      });
      ev.push({ t: T.assembled - 420,
                play: function (at) { breath(at, 0.62, 320, 2900, 0.022); } });
      ev.push({ t: T.assembled, play: function (at) { chord(at); } });
      return ev;
    }

    function schedule(nowMs) {
      if (scheduled) return;
      scheduled = true;
      var origin = ac.currentTime + 0.06;
      var endLeft = (FINAL + T.hold - nowMs) / 1000;
      score().forEach(function (e) {
        var at = origin + (e.t - nowMs) / 1000;
        if (at < ac.currentTime) {
          if (e.t === 0) e.play(ac.currentTime + 0.05, endLeft);  // pad can join late
          return;                                                // the rest has passed
        }
        e.play(at, endLeft);
      });
    }

    function paint() {
      if (!sndBtn) return;
      sndBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      sndBtn.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
    }

    function enable(nowMs) {
      if (!AC) return false;
      try {
        if (!ac) build();
        if (ac.state === 'suspended') ac.resume();
        if (ac.state !== 'running') return false;
        on = true;
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setValueAtTime(master.gain.value, ac.currentTime);
        master.gain.linearRampToValueAtTime(CC_CONFIG.volume, ac.currentTime + 0.35);
        schedule(nowMs);
        paint();
        return true;
      } catch (e) { return false; }
    }

    function mute() {
      on = false;
      if (ac && master) {
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setValueAtTime(master.gain.value, ac.currentTime);
        master.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.25);
      }
      paint();
    }

    return {
      isOn: function () { return on; },
      wanted: function () {
        try {
          var v = sessionStorage.getItem('ccSound');
          if (v !== null) return v === '1';
        } catch (e) {}
        return !!CC_CONFIG.sound;
      },
      /* try to start; if the browser is still holding audio back, latch on
         to the first interaction instead of nagging the visitor */
      arm: function (nowMs) {
        armed = false; scheduled = false;
        paint();
        if (!this.wanted()) return;
        if (enable(nowMs)) return;
        armed = true;
        var self = this;
        var go = function () {
          if (!armed) return;
          armed = false;
          enable(self.now());
          document.removeEventListener('pointerdown', go, true);
          document.removeEventListener('keydown', go, true);
        };
        document.addEventListener('pointerdown', go, true);
        document.addEventListener('keydown', go, true);
      },
      toggle: function (nowMs) {
        var next = !on;
        try { sessionStorage.setItem('ccSound', next ? '1' : '0'); } catch (e) {}
        if (next) { armed = false; enable(nowMs); } else { mute(); }
      },
      now: function () { return 0; },        // replaced below with the clock
      stop: function () {
        armed = false;
        if (!ac) return;
        try {
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setValueAtTime(master.gain.value, ac.currentTime);
          master.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.4);
        } catch (e) {}
        var dying = ac;
        setTimeout(function () { try { dying.close(); } catch (e) {} }, 700);
        ac = null; master = null; conv = null; on = false; scheduled = false;
        paint();
      }
    };
  })();

  /* ------------------------------------------------------------- loop ---- */
  var start = null, raf = null, done = false, autoT = null, waitT = null;
  var clock = 0;
  AU.now = function () { return clock; };

  function frame(ts) {
    if (start === null) start = ts;
    clock = reduced ? FINAL : (ts - start) / sp;
    draw(clock);
    raf = requestAnimationFrame(frame);
  }

  function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

  function ready() {
    window.dispatchEvent(new CustomEvent('cleancookiq:ready'));
    try { parent.postMessage('cleancookiq:ready', '*'); } catch (e) {}
  }

  function hardSkip() {
    splash.style.display = 'none';
    done = true;
    ready();
  }

  function finish() {
    if (done) return;
    done = true;
    clearTimeout(autoT); clearTimeout(waitT);
    try { if (CC_CONFIG.oncePerSession) sessionStorage.setItem('ccIntroSeen', '1'); } catch (e) {}
    if (CC_CONFIG.redirectTo) { location.href = CC_CONFIG.redirectTo; return; }
    AU.stop();
    splash.setAttribute('data-state', 'out');
    splash.setAttribute('aria-hidden', 'true');
    if (skip) skip.disabled = true;
    setTimeout(function () {
      stop();
      splash.style.display = 'none';
      ready();
    }, 640);
  }

  function begin() {
    done = false; start = null;
    splash.style.display = '';
    splash.removeAttribute('data-state');
    splash.removeAttribute('aria-hidden');
    if (skip) skip.disabled = false;
    resize();
    stop();
    clock = 0;
    raf = requestAnimationFrame(frame);
    AU.arm(0);
    if (CC_CONFIG.waitForApp) {
      waitT = setTimeout(finish, CC_CONFIG.maxWait);
    } else {
      autoT = setTimeout(finish, reduced ? 1900 : (FINAL + T.hold) * sp);
    }
  }

  /* ---------------------------------------------------------- wiring ----- */
  if (!CC_CONFIG.showSkip && skip) { skip.remove(); skip = null; }
  if (skip) skip.addEventListener('click', finish);
  if (sndBtn) sndBtn.addEventListener('click', function () { AU.toggle(clock); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') finish();
  });
  // ResizeObserver catches the first layout pass as well as later resizes,
  // so the backing store is never out of step with the displayed size
  if (window.ResizeObserver) {
    new window.ResizeObserver(resize).observe(cv);
  } else {
    window.addEventListener('resize', resize);
  }

  var seen = false;
  try { seen = CC_CONFIG.oncePerSession && sessionStorage.getItem('ccIntroSeen') === '1'; } catch (e) {}

  window.ccIntro = {
    finish: finish, replay: begin, config: CC_CONFIG,
    sound: function (want) {          // sound(), sound(true) or sound(false)
      if (want === undefined || !!want !== AU.isOn()) AU.toggle(clock);
      return AU.isOn();
    }
  };

  if (seen) hardSkip();
  else begin();
})();
</script>
<style>html,body{margin:0;background:transparent}</style>
</body></html>
